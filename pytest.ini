[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra -q --strict-markers
markers =
    slow: testes que levam mais de 1 segundo
    integration: testes de integração multicomponente
    security: testes de segurança
    unit: testes isolados
    stale: falha pré-existente documentada (não esconder); não usar como gate até corrigir
