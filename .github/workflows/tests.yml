name: CI

on:
  push:
    branches: [main, feature/estrutura-profissional, feature/*]
  pull_request:
    branches: [main, feature/estrutura-profissional]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    env:
      GEMINI_VIDEO_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, not slow)
        run: pytest -q --maxfail=1 --tb=short -m "not slow"

      - name: Type check (mypy, non-blocking for first pass — documented)
        run: mypy . --ignore-missing-imports --no-strict-optional || echo "mypy non-blocking: document limitations"
